<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Page Not Found | ApexShopy</title>

  <meta
    name="description"
    content="The page you are looking for could not be found on ApexShopy."
  >

  <meta name="robots" content="noindex, follow">

  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="stylesheet" href="/style.css">

  <style>
    .error-page {
      min-height: 70vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 20px;
    }

    .error-content {
      max-width: 650px;
    }

    .error-code {
      font-size: clamp(80px, 18vw, 160px);
      line-height: 1;
      font-weight: 900;
      margin: 0 0 20px;
    }

    .error-content h1 {
      font-size: 32px;
      margin-bottom: 15px;
    }

    .error-content p {
      font-size: 17px;
      margin-bottom: 30px;
    }

    .error-home {
      display: inline-block;
      padding: 13px 24px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 700;
      background: #ff6a00;
      color: #fff;
    }
  </style>
</head>

<body>

  <header class="site-header">
    <div class="header-container">
      <a href="/" class="logo">
        <span class="logo-mark">◆</span>
        <span class="logo-text">
          APEX<span>SHOPY</span>
        </span>
      </a>

      <nav class="main-nav">
        <a href="/">Home</a>
        <a href="/category.html">Categories</a>
        <a href="/#shop">Shop</a>
      </nav>
    </div>
  </header>

  <main class="error-page">
    <div class="error-content">

      <div class="error-code">404</div>

      <h1>Page Not Found</h1>

      <p>
        Sorry, the page you're looking for doesn't exist
        or may have been moved.
      </p>

      <a href="/" class="error-home">
        Back to ApexShopy
      </a>

    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <div class="footer-bottom">
        <p>
          &copy;
          <span id="currentYear"></span>
          ApexShopy. All rights reserved.
        </p>
      </div>
    </div>
  </footer>

  <script>
    document.getElementById("currentYear").textContent =
      new Date().getFullYear();
  </script>

</body>
</html>
