<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ApexShopy - Premium Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Navigation -->
    <header class="header">
        <div class="logo">ApexShopy</div>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Search products..." onkeyup="filterProducts()">
        </div>
        <button class="cart-icon-btn" onclick="toggleCart()">
            🛒 <span class="cart-count" id="cartCount">0</span>
        </button>
    </header>

    <!-- Category Filter Bar -->
    <div class="categories">
        <button class="active" onclick="filterCategory('All', event)">All</button>
        <button onclick="filterCategory('Electronics', event)">Electronics</button>
        <button onclick="filterCategory('Wearables', event)">Wearables</button>
        <button onclick="filterCategory('Accessories', event)">Accessories</button>
        <button onclick="filterCategory('Sports & Outdoors', event)">Sports & Outdoors</button>
        <button onclick="filterCategory('Smart Home', event)">Smart Home</button>
    </div>

    <!-- Main Content / Product Grid -->
    <main class="main-container">
        <div class="product-grid" id="productGrid">
            <!-- Dynamic products render here via script.js -->
        </div>
    </main>

    <!-- Slide-out Cart Sidebar & Overlay -->
    <div class="cart-overlay" id="cartOverlay" onclick="toggleCart()"></div>
    
    <aside class="cart-sidebar" id="cartSidebar">
        <div class="cart-header">
            <h2>Your Cart</h2>
            <button class="close-cart" onclick="toggleCart()">✕</button>
        </div>
        <div class="cart-items" id="cartItems">
            <!-- Cart items render here dynamically -->
        </div>
        <div class="cart-footer">
            <div class="cart-total">
                <span>Total:</span>
                <span id="cartTotalAmount">$0.00</span>
            </div>
            <button class="checkout-btn" onclick="checkoutMultiPlatform()">Proceed to Checkout</button>
        </div>
    </aside>

    <!-- External JavaScript File -->
    <script src="script.js"></script>
</body>
</html>
